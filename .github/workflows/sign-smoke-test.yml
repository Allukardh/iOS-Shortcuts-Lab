name: Build iOS 17.3.1 Shortcuts

on:
  workflow_dispatch:
  push:
    paths:
      - "donors/**"
      - "scripts/**"
      - ".github/workflows/sign-smoke-test.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Extract donor workflows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/extracted
          for input in donors/*.shortcut; do
            name="$(basename "$input" .shortcut)"
            workdir="$(mktemp -d)"
            python3 scripts/extract_signed.py "$input" "$workdir"
            cp "$workdir/Shortcut.wflow" "build/extracted/$name.wflow"
            rm -rf "$workdir"
          done

      - name: Build final variants and validate iOS 17 action types
        run: python3 scripts/build_shortcuts.py --in-dir build/extracted --out-dir build/unsigned

      - name: Upload editable and binary workflows (NOT YET signed)
        uses: actions/upload-artifact@v4
        with:
          name: editable-v2-workflows
          path: build/unsigned/
          if-no-files-found: error
