name: Build and optionally sign Shortcuts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "donors/**"
      - "scripts/**"
      - ".github/workflows/sign-smoke-test.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Extract original iOS 17.3.1 workflows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/extracted
          for input in donors/*.shortcut; do
            name="$(basename "$input" .shortcut)"
            workdir="$(mktemp -d)"
            python3 scripts/extract_signed.py "$input" "$workdir"
            cp "$workdir/Shortcut.wflow" "build/extracted/$name.wflow"
            rm -rf "$workdir"
          done

      - name: Build and validate iOS 17.3.1 workflows
        run: python3 scripts/build_shortcuts.py --in-dir build/extracted --out-dir build/unsigned

      - name: Upload editable source workflows
        uses: actions/upload-artifact@v4
        with:
          name: editable-v2-workflows
          path: build/unsigned/
          if-no-files-found: error

      - name: Check HubSign credential availability
        id: signer
        shell: bash
        env:
          HUBSIGN_API_KEY: ${{ secrets.HUBSIGN_API_KEY }}
        run: |
          if [[ -n "$HUBSIGN_API_KEY" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "HubSign secret not configured; upload only developer workflows."
          fi

      - name: Sign through official RoutineHub HubSign API
        if: steps.signer.outputs.enabled == 'true'
        shell: bash
        env:
          HUBSIGN_API_KEY: ${{ secrets.HUBSIGN_API_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/hubsign.py --input build/unsigned/Voice-to-Status.wflow --name '🎙️ Voice → Status' --output build/signed/Voice-to-Status.shortcut
          python3 scripts/hubsign.py --input build/unsigned/Speed-Video.wflow --name '⚡ Speed Video' --output build/signed/Speed-Video.shortcut
          for shortcut in build/signed/*.shortcut; do
            tmp="$(mktemp -d)"
            python3 scripts/extract_signed.py "$shortcut" "$tmp"
            test -s "$tmp/Shortcut.wflow"
            rm -rf "$tmp"
          done

      - name: Upload signed installable shortcuts
        if: steps.signer.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios17-signed-shortcuts
          path: build/signed/
          if-no-files-found: error
