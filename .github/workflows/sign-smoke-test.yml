name: Shortcut donor extraction (iOS 17)

on:
  workflow_dispatch:
  push:
    paths:
      - "donors/**"
      - "scripts/extract_signed.py"
      - ".github/workflows/sign-smoke-test.yml"

permissions:
  contents: read

jobs:
  extract:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Extract signed AEA1 originals (no iCloud login required)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/extracted
          for input in donors/*.shortcut; do
            name="$(basename "$input" .shortcut)"
            workdir="$(mktemp -d)"
            python3 scripts/extract_signed.py "$input" "$workdir"
            cp "$workdir/Shortcut.wflow" "build/extracted/$name.wflow"
            python3 -c 'import plistlib,sys; p=plistlib.load(open(sys.argv[1],"rb")); plistlib.dump(p,open(sys.argv[2],"wb"),fmt=plistlib.FMT_XML,sort_keys=False)' "$workdir/Shortcut.wflow" "build/extracted/$name.plist"
            rm -rf "$workdir"
          done

      - name: Upload editable donors
        uses: actions/upload-artifact@v4
        with:
          name: extracted-workflows
          path: build/extracted/
          if-no-files-found: error
