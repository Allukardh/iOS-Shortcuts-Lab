name: Build and sign iOS 17 Shortcuts (Shortcuty)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "donors/**"
      - "scripts/build_shortcuts.py"
      - "scripts/extract_signed.py"
      - "scripts/sign_shortcuty.py"
      - ".github/workflows/sign-smoke-test.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Extract original iOS 17.3.1 workflows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/extracted
          for input in donors/*.shortcut; do
            name="$(basename "$input" .shortcut)"
            workdir="$(mktemp -d)"
            python3 scripts/extract_signed.py "$input" "$workdir"
            cp "$workdir/Shortcut.wflow" "build/extracted/$name.wflow"
            rm -rf "$workdir"
          done

      - name: Build iOS 17.3.1 variants
        run: python3 scripts/build_shortcuts.py --in-dir build/extracted --out-dir build/unsigned

      - name: Sign Voice → Status through official Shortcuty API
        run: |
          python3 scripts/sign_shortcuty.py \
            --input build/unsigned/Voice-to-Status.wflow \
            --upload-filename '🎙️ Voice → Status.shortcut' \
            --output 'build/signed/🎙️ Voice → Status.shortcut'

      - name: Sign Speed Video through official Shortcuty API
        run: |
          python3 scripts/sign_shortcuty.py \
            --input build/unsigned/Speed-Video.wflow \
            --upload-filename '⚡ Speed Video.shortcut' \
            --output 'build/signed/⚡ Speed Video.shortcut'

      - name: Independently check signatures and workflow action integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/extract_signed.py 'build/signed/🎙️ Voice → Status.shortcut' build/verify-voice
          python3 scripts/extract_signed.py 'build/signed/⚡ Speed Video.shortcut' build/verify-speed
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          for name,dir_name in [('Voice-to-Status','verify-voice'),('Speed-Video','verify-speed')]:
              a=plistlib.loads(Path(f'build/unsigned/{name}.wflow').read_bytes())
              b=plistlib.loads(Path(f'build/{dir_name}/Shortcut.wflow').read_bytes())
              assert a['WFWorkflowActions']==b['WFWorkflowActions'],f'Action mismatch: {name}'
              assert a['WFWorkflowMinimumClientVersion']==b['WFWorkflowMinimumClientVersion']
              print(f'PASS: {name} ({len(a["WFWorkflowActions"])} actions preserved, AEA1 extracted)')
          PY

      - name: Upload signed Shortcuts ready for device import testing
        uses: actions/upload-artifact@v4
        with:
          name: ios17-shortcuts-signed-by-shortcuty
          path: build/signed/*.shortcut
          if-no-files-found: error

      - name: Upload editable workflow sources
        uses: actions/upload-artifact@v4
        with:
          name: ios17-shortcuts-editable-sources
          path: build/unsigned/*.wflow
          if-no-files-found: error

      - name: Publish installable signed shortcuts to repository gallery
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p shortcuts
          cp 'build/signed/🎙️ Voice → Status.shortcut' 'shortcuts/🎙️ Voice → Status.shortcut'
          cp 'build/signed/⚡ Speed Video.shortcut' 'shortcuts/⚡ Speed Video.shortcut'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shortcuts/
          if git diff --cached --quiet; then
            echo 'No changes in signed releases.'
          else
            git commit -m 'dist: publish verified signed shortcuts [skip ci]'
            git push origin HEAD:main
          fi
