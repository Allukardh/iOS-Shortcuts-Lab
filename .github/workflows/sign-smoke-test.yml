name: Shortcut signing smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - "donors/**"
      - ".github/workflows/sign-smoke-test.yml"

jobs:
  roundtrip:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check Apple shortcut tooling
        run: |
          set -euxo pipefail
          sw_vers
          xcrun --find shortcuts || command -v shortcuts
          command -v aea
          command -v aa
          shortcuts --help

      - name: Extract and re-sign donors
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build
          for input in donors/*.shortcut; do
            name="$(basename "$input" .shortcut)"
            auth_len=$(python3 - "$input" <<'PY'
import struct,sys
d=open(sys.argv[1],"rb").read(12)
assert d[:4] == b"AEA1"
print(struct.unpack("<I",d[8:12])[0])
PY
)
            dd if="$input" of=build/auth.bplist bs=1 skip=12 count="$auth_len" status=none
            plutil -extract SigningCertificateChain.0 raw build/auth.bplist -o build/cert.b64
            base64 -D -i build/cert.b64 -o build/cert.der
            openssl x509 -in build/cert.der -inform DER -pubkey -noout > build/sign-pub.pem
            aea decrypt -sign-pub build/sign-pub.pem -i "$input" -o build/payload.aar
            rm -rf build/extracted && mkdir -p build/extracted
            aa extract -i build/payload.aar -d build/extracted
            workflow="$(find build/extracted -name '*.wflow' -print -quit)"
            test -n "$workflow"
            shortcuts sign --mode anyone --input "$workflow" --output "build/$name.resigned.shortcut"
            xxd -l 4 "build/$name.resigned.shortcut" | grep -q AEA1
          done

      - uses: actions/upload-artifact@v4
        with:
          name: signed-roundtrip
          path: build/*.resigned.shortcut
