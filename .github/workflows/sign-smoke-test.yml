name: Shortcut signing smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - "donors/**"
      - "scripts/extract_signed.py"
      - ".github/workflows/sign-smoke-test.yml"

permissions:
  contents: read

jobs:
  roundtrip:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Verify macOS command-line tools
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          for program in aea aa shortcuts plutil openssl python3; do
            command -v "$program"
          done

      - name: Extract and re-sign originals
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          for input in donors/*.shortcut; do
            name="$(basename "$input" .shortcut)"
            workdir="$(mktemp -d)"
            python3 scripts/extract_signed.py "$input" "$workdir"
            test -s "$workdir/Shortcut.wflow"
            shortcuts sign --mode anyone --input "$workdir/Shortcut.wflow" --output "build/$name.resigned.shortcut"
            python3 -c 'import sys; assert open(sys.argv[1],"rb").read(4) == b"AEA1"' "build/$name.resigned.shortcut"
            rm -rf "$workdir"
          done

      - name: Upload signed shortcuts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: signed-roundtrip
          path: build/*.resigned.shortcut
          if-no-files-found: error
