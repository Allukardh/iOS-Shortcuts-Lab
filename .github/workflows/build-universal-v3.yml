name: Build Speed Video Universal v3 (native audio first)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_universal_v3.py"
      - ".github/workflows/build-universal-v3.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Extract real iOS 17.3.1 donor
        run: python3 scripts/extract_signed.py donors/Speed-Video.original.shortcut build/donor

      - name: Generate v3 with native Encode Media FIRST
        run: |
          python3 scripts/build_universal_v3.py --donor build/donor/Shortcut.wflow \
            --output build/unsigned/universal-v3.wflow

      - name: Regression test against real iOS 17.3.1 media input
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/extract_signed.py 'donors/Speed-Universal-v3.iOS17-edited.shortcut' build/ios-reference
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          generated=plistlib.loads(Path('build/unsigned/universal-v3.wflow').read_bytes())
          native=plistlib.loads(Path('build/ios-reference/Shortcut.wflow').read_bytes())
          def encoder(p):
              return next(a['WFWorkflowActionParameters'] for a in p['WFWorkflowActions']
                          if a['WFWorkflowActionIdentifier']=='is.workflow.actions.encodemedia')
          a,b=encoder(generated),encoder(native)
          for key in ['WFMedia','WFInput','WFMediaAudioOnly','WFMediaAudioFormat','WFMediaSpeed']:
              assert a.get(key)==b.get(key),(key,a.get(key),b.get(key))
          print('PASS: media input matches actual iOS 17.3.1 exported Encode Media')
          PY

      - name: Sign with public Shortcuty service
        run: |
          python3 scripts/sign_shortcuty.py --input build/unsigned/universal-v3.wflow \
            --upload-filename '⚡ Speed Video Universal v3.shortcut' \
            --output 'build/signed/⚡ Speed Video Universal v3.shortcut'

      - name: Verify AEA1 signature and EXACT action structure
        run: |
          python3 scripts/extract_signed.py 'build/signed/⚡ Speed Video Universal v3.shortcut' build/verified
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          a=plistlib.loads(Path('build/unsigned/universal-v3.wflow').read_bytes())
          b=plistlib.loads(Path('build/verified/Shortcut.wflow').read_bytes())
          assert a['WFWorkflowActions']==b['WFWorkflowActions']
          assert len(a['WFWorkflowActions'])==24
          assert a['WFWorkflowMinimumClientVersion']==b['WFWorkflowMinimumClientVersion']
          print("PASS: signed workflow exactly matches 24-action source")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: speed-video-universal-v3-experimental
          path: build/signed/*.shortcut
          if-no-files-found: error

      - name: Publish new v3 only
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          cp 'build/signed/⚡ Speed Video Universal v3.shortcut' 'shortcuts/⚡ Speed Video Universal v3.shortcut'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'shortcuts/⚡ Speed Video Universal v3.shortcut'
          git commit -m 'dist: Universal v3 native audio first [skip ci]'
          git push origin HEAD:main
