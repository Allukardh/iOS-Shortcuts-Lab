name: Build Speed Video Audio Test (iOS 17.3.1)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_universal_probe.py"
      - ".github/workflows/build-audio-test.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Extract trusted donor
        run: python3 scripts/extract_signed.py donors/Speed-Video.original.shortcut build/donor
      - name: Insert visible preview after native media conversion
        run: |
          python3 scripts/build_universal_probe.py --donor build/donor/Shortcut.wflow --output build/unsigned/audio-test.wflow
      - name: Sign temporary diagnostic Shortcut
        run: |
          python3 scripts/sign_shortcuty.py --input build/unsigned/audio-test.wflow \
            --upload-filename '⚡ Speed Video Audio Test.shortcut' \
            --output 'build/signed/⚡ Speed Video Audio Test.shortcut'
      - name: Validate signer did not modify actions
        run: |
          python3 scripts/extract_signed.py 'build/signed/⚡ Speed Video Audio Test.shortcut' build/verified
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          a=plistlib.loads(Path('build/unsigned/audio-test.wflow').read_bytes())
          b=plistlib.loads(Path('build/verified/Shortcut.wflow').read_bytes())
          assert a['WFWorkflowActions']==b['WFWorkflowActions']
          assert len(a['WFWorkflowActions'])==25
          print('PASS: 25 diagnostic actions preserved')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: speed-video-audio-test-ios17
          path: build/signed/*.shortcut
          if-no-files-found: error
      - name: Publish ONLY independent diagnostic shortcut
        if: github.ref == 'refs/heads/main'
        run: |
          cp 'build/signed/⚡ Speed Video Audio Test.shortcut' 'shortcuts/⚡ Speed Video Audio Test.shortcut'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'shortcuts/⚡ Speed Video Audio Test.shortcut'
          git commit -m 'dist: Speed Video native audio diagnostic [skip ci]'
          git push origin HEAD:main
