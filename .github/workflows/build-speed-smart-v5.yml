name: Build experimental Smart Speed v5

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_speed_smart_v5.py"
      - ".github/workflows/build-speed-smart-v5.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Extract original and on-device-verified iOS 17.3.1 donors
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/extract_signed.py 'donors/Speed-Video.original.shortcut' build/donor
          python3 scripts/extract_signed.py 'donors/Speed-Universal-v3.iOS17-edited.shortcut' build/native-reference

      - name: Generate state-machine automatic fast path + Apple audio fallback
        run: |
          python3 scripts/build_speed_smart_v5.py \
            --donor build/donor/Shortcut.wflow \
            --ios-ref build/native-reference/Shortcut.wflow \
            --output build/unsigned/smart-v5.wflow

      - name: Validate native media binding & callback graph
        shell: bash
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          flow=plistlib.loads(Path('build/unsigned/smart-v5.wflow').read_bytes())['WFWorkflowActions']
          assert len(flow)==61
          native=[a['WFWorkflowActionParameters'] for a in flow if a['WFWorkflowActionIdentifier']=='is.workflow.actions.encodemedia']
          assert len(native)==5
          assert all(a['WFMedia']['Value']['Type']=='ActionOutput' for a in native)
          assert all(a['WFMediaAudioFormat']=='AIFF' for a in native)
          print('PASS: five fallback branches using native iOS 17 Encode Media action')
          PY

      - name: Sign with official public Shortcuty service
        run: |
          python3 scripts/sign_shortcuty.py \
            --input build/unsigned/smart-v5.wflow \
            --upload-filename '⚡ Speed Video Smart Test.shortcut' \
            --output 'build/signed/⚡ Speed Video Smart Test.shortcut'

      - name: Verify signed AEA1 action payload
        run: |
          python3 scripts/extract_signed.py 'build/signed/⚡ Speed Video Smart Test.shortcut' build/verified
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          a=plistlib.loads(Path('build/unsigned/smart-v5.wflow').read_bytes())
          b=plistlib.loads(Path('build/verified/Shortcut.wflow').read_bytes())
          assert a['WFWorkflowActions']==b['WFWorkflowActions']
          assert a['WFWorkflowMinimumClientVersion']==b['WFWorkflowMinimumClientVersion']
          print('PASS: 61 intended actions preserved after Shortcuty signing')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: speed-video-smart-v5-experimental-signed
          path: build/signed/*.shortcut
          if-no-files-found: error

      - name: Publish only to GitHub experimental shelf
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p shortcuts/experimental
          cp 'build/signed/⚡ Speed Video Smart Test.shortcut' 'shortcuts/experimental/⚡ Speed Video Smart Test.shortcut'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'shortcuts/experimental/⚡ Speed Video Smart Test.shortcut'
          git commit -m 'dist: staged smart v5 validation candidate [skip ci]'
          git push origin HEAD:main
