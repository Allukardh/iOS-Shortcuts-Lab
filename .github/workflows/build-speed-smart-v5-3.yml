name: Build Smart Speed v5.3 with extension preflight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_speed_smart_v5_3.py"
      - ".github/workflows/build-speed-smart-v5-3.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Extract real iOS 17.3.1 donor and native Encode Media reference
        shell: bash
        run: |
          python3 scripts/extract_signed.py donors/Speed-Video.original.shortcut build/legacy
          python3 scripts/extract_signed.py donors/Speed-Universal-v3.iOS17-edited.shortcut build/native

      - name: Build Smart v5.3 one-foreground design
        run: |
          python3 scripts/build_speed_smart_v5_3.py \
            --donor build/legacy/Shortcut.wflow \
            --ios-ref build/native/Shortcut.wflow \
            --output build/unsigned/smart-v5-3.wflow

      - name: Verify on-device iOS native media parameter and no shell conditions
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          a=plistlib.loads(Path('build/unsigned/smart-v5-3.wflow').read_bytes())
          b=plistlib.loads(Path('build/native/Shortcut.wflow').read_bytes())
          acts=a['WFWorkflowActions']
          enc=[x['WFWorkflowActionParameters'] for x in acts if x['WFWorkflowActionIdentifier']=='is.workflow.actions.encodemedia']
          proven=next(x['WFWorkflowActionParameters'] for x in b['WFWorkflowActions'] if x['WFWorkflowActionIdentifier']=='is.workflow.actions.encodemedia')
          assert len(enc)==5
          for x in enc:
              assert x['WFMedia']==proven['WFMedia']
              assert x['WFMediaAudioOnly']==proven['WFMediaAudioOnly']
              assert x['WFMediaAudioFormat']==proven['WFMediaAudioFormat']
          ex=[x['WFWorkflowActionParameters'] for x in acts if x['WFWorkflowActionIdentifier']=='AsheKube.app.a-Shell-mini.ExecuteCommandIntent']
          p=[x for x in ex if 'ffprobe ' in x.get('command','')]
          assert len(p)==5 and all(x['openWindow']=='close' for x in p)
          assert len([x for x in ex if 'ffmpeg ' in x.get('command','')])==10
          print('PASS: iOS 17 native media and nonlaunching ffprobe intentions')
          PY

      - name: Sign with Shortcuty
        run: |
          python3 scripts/sign_shortcuty.py \
            --input build/unsigned/smart-v5-3.wflow \
            --upload-filename '⚡ Speed Video Smart v5.3.shortcut' \
            --output 'build/signed/⚡ Speed Video Smart v5.3.shortcut'

      - name: Verify signed AEA1 contains exact source
        run: |
          python3 scripts/extract_signed.py 'build/signed/⚡ Speed Video Smart v5.3.shortcut' build/signed-extract
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          a=plistlib.loads(Path('build/unsigned/smart-v5-3.wflow').read_bytes())
          b=plistlib.loads(Path('build/signed-extract/Shortcut.wflow').read_bytes())
          assert a['WFWorkflowActions']==b['WFWorkflowActions']
          assert a['WFWorkflowMinimumClientVersion']==b['WFWorkflowMinimumClientVersion']
          print('PASS: signed action payload is unchanged')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: speed-video-smart-v5-3-extension-preflight-experimental
          path: build/signed/*.shortcut
          if-no-files-found: error

      - name: Publish ONLY experimental candidate; do not touch proven releases
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p shortcuts/experimental
          cp 'build/signed/⚡ Speed Video Smart v5.3.shortcut' 'shortcuts/experimental/⚡ Speed Video Smart v5.3.shortcut'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'shortcuts/experimental/⚡ Speed Video Smart v5.3.shortcut'
          git commit -m 'dist: Smart v5.3 extension-preflight test candidate [skip ci]'
          git push origin HEAD:main
