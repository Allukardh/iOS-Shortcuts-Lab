name: Build Smart v5.3 background codec probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_speed_smart_v5_3.py"
      - ".github/workflows/build-speed-smart-v5-3.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Extract working iOS 17.3.1 donors
        run: |
          python3 scripts/extract_signed.py donors/Speed-Video.original.shortcut build/orig
          python3 scripts/extract_signed.py donors/Speed-Universal-v3.iOS17-edited.shortcut build/ios
      - name: Generate shortcut
        run: |
          python3 scripts/build_speed_smart_v5_3.py \
            --donor build/orig/Shortcut.wflow \
            --ios-ref build/ios/Shortcut.wflow \
            --output build/unsigned/smart-v5.3.wflow
      - name: Verify offscreen preflight and callback placement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          obj=plistlib.loads(Path('build/unsigned/smart-v5.3.wflow').read_bytes())
          acts=obj['WFWorkflowActions']
          assert len(acts)==76
          probes=[x['WFWorkflowActionParameters'] for x in acts if 'ffprobe ' in x.get('WFWorkflowActionParameters',{}).get('command','')]
          ffmpeg=[x['WFWorkflowActionParameters'] for x in acts if 'ffmpeg ' in x.get('WFWorkflowActionParameters',{}).get('command','')]
          assert len(probes)==5 and len(ffmpeg)==10
          assert all(p['openWindow']=='close' and 'sh -c' not in p['command'] for p in probes)
          assert all(p['openWindow']=='open' for p in ffmpeg)
          print('PASS: probe runs in extension, conversion opens app')
          PY
      - name: Sign Shortcut with Shortcuty
        run: |
          python3 scripts/sign_shortcuty.py \
            --input build/unsigned/smart-v5.3.wflow \
            --upload-filename '⚡ Speed Video Smart v5.3.shortcut' \
            --output 'build/signed/⚡ Speed Video Smart v5.3.shortcut'
      - name: Check signed AEA1 round-trip integrity
        run: |
          python3 scripts/extract_signed.py 'build/signed/⚡ Speed Video Smart v5.3.shortcut' build/verified
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          a=plistlib.loads(Path('build/unsigned/smart-v5.3.wflow').read_bytes())
          b=plistlib.loads(Path('build/verified/Shortcut.wflow').read_bytes())
          assert a['WFWorkflowActions']==b['WFWorkflowActions']
          print('PASS: signer preserved all 76 action instructions')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: smart-speed-v5-3-offscreen-probe-beta
          path: build/signed/*.shortcut
          if-no-files-found: error
      - name: Publish only experimental to GitHub
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          mkdir -p shortcuts/experimental
          cp 'build/signed/⚡ Speed Video Smart v5.3.shortcut' 'shortcuts/experimental/⚡ Speed Video Smart v5.3.shortcut'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'shortcuts/experimental/⚡ Speed Video Smart v5.3.shortcut'
          git commit -m 'dist: Smart v5.3 offscreen probe trial [skip ci]'
          git push origin HEAD:main
